<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>b站音乐播放器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23fb7299'/%3E%3Cpath d='M21 32V17l11-2.6V29' stroke='white' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17.6' cy='32' r='3.6' fill='white'/%3E%3Ccircle cx='28.6' cy='29' r='3.6' fill='white'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/app-icon-192.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d0a10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="b站音乐" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ============ 首次引导 ============ -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-logo">
      <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
        <rect x="4" y="12" width="40" height="30" rx="9" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M16 12 L21 4 M32 12 L27 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="17" cy="26" r="2.6" fill="currentColor"/>
        <circle cx="31" cy="26" r="2.6" fill="currentColor"/>
        <path d="M18 34 q6 4 12 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>b站音乐播放器</h1>
    <p class="gate-sub">把 B 站收藏夹当歌单听。粘贴收藏夹链接，或者用 UID 一次导入全部公开收藏夹。</p>

    <div class="gate-form">
      <input id="gateInput" type="text" spellcheck="false" autocomplete="off"
             placeholder="https://space.bilibili.com/xxx/favlist?fid=123456" />
      <button id="gateBtn">开始听</button>
    </div>
    <div id="gateHint" class="gate-hint">也支持直接填收藏夹 ID（<code>fid</code> 后面那串数字）</div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="app" hidden>

  <!-- 侧边栏：收藏夹 -->
  <aside class="sidebar">
    <div class="side-head">
      <span>我的收藏夹</span>
      <button id="addFolderBtn" class="icon-btn tiny" title="添加收藏夹">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="folderList" class="folder-list"></div>
    <button id="addFolderMobile" class="folder-add" title="添加收藏夹" aria-label="添加收藏夹">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="side-foot">
      <button id="importUidBtn" class="ghost-btn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 4v10m0 0 l-3.5-3.5M12 14 l3.5-3.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        按 UID 批量导入
      </button>
    </div>
  </aside>

  <!-- 右侧主区 -->
  <div class="main-col">
    <header class="topbar">
      <div class="fav-meta">
        <div class="fav-cover" id="favCover"></div>
        <div class="fav-text">
          <h1 id="favTitle">加载中…</h1>
          <p id="favSub">—</p>
        </div>
      </div>

      <div class="topbar-tools">
        <div class="search">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16 16 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="搜标题 / UP 主" spellcheck="false" autocomplete="off" />
        </div>
        <button id="shuffleAllBtn" class="pill-btn" title="随机播放整个收藏夹">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h4l8 10h4M4 17h4l3-3.7M14 8.2 L16 7h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 4.5 L21 7 l-2.5 2.5M18.5 14.5 L21 17 l-2.5 2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>随机播放</span>
        </button>
        <button id="reloadBtn" class="icon-btn" title="重新拉取收藏夹">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.5-5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 3.5 V9 h-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="miniBtn" class="icon-btn hide" title="悬浮窗：置顶小卡片，放角落不挡事">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <rect x="2.8" y="4.8" width="18.4" height="14.4" rx="2.6" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="11.6" y="11.4" width="6.4" height="5" rx="1.2" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="list-pane">
      <div class="list-cols">
        <span class="col-idx">#</span>
        <span class="col-title">歌曲</span>
        <span class="col-upper">UP 主</span>
        <span class="col-time">时长</span>
      </div>
      <div id="trackList" class="track-list" role="list"></div>
      <div id="emptyState" class="empty" hidden></div>
    </main>
  </div>

  <!-- 播放器 -->
  <footer class="player">
    <div class="progress-row">
      <span id="curTime" class="t-time">0:00</span>
      <div id="progress" class="progress" role="slider" tabindex="0" aria-label="播放进度">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div id="progressKnob" class="progress-knob"></div>
      </div>
      <span id="totTime" class="t-time">0:00</span>
    </div>

    <div class="ctrl-row">
      <div class="now-playing">
        <div id="npCover" class="np-cover"></div>
        <div class="np-text">
          <div id="npTitle" class="np-title">未在播放</div>
          <div id="npUpper" class="np-upper">—</div>
        </div>
      </div>

      <div class="transport">
        <button id="prevBtn" class="icon-btn" title="上一首 (P)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 5 L8 12 L18 19 Z" fill="currentColor"/><rect x="5" y="5" width="2.2" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button id="playBtn" class="play-btn" title="播放 / 暂停 (空格)">
          <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5 L19 12 L8 19 Z" fill="currentColor"/></svg>
          <svg id="iconPause" class="hide" viewBox="0 0 24 24" width="22" height="22"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>
        <button id="nextBtn" class="icon-btn" title="下一首 (N)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 5 L16 12 L6 19 Z" fill="currentColor"/><rect x="16.8" y="5" width="2.2" height="14" rx="1" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="right-tools">
        <button id="modeBtn" class="icon-btn mode-btn" title="播放模式：顺序循环">
          <svg id="modeList" viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 15.5 l2.5 2.5 2.5-2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2,-1)"/></svg>
          <svg id="modeOne" class="hide" viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="15.5" y="17.5" font-size="11" font-weight="700" fill="currentColor">1</text><path d="M17.5 14.5 l2.5 2.5 2.5-2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2,-1)"/></svg>
          <svg id="modeShuffle" class="hide" viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h4l8 10h4M4 17h4l3-3.7M14 8.2 L16 7h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 4.5 L21 7 l-2.5 2.5M18.5 14.5 L21 17 l-2.5 2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="volume">
          <button id="muteBtn" class="icon-btn" title="静音 (M)">
            <svg id="volIcon" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/><path id="volWave" d="M15.5 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
          </button>
          <div id="volBar" class="vol-bar">
            <div class="vol-track"><div id="volFill" class="vol-fill"></div></div>
            <div id="volKnob" class="vol-knob"></div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
</div>

<!-- ============ 添加收藏夹 ============ -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="folder">收藏夹链接 / ID</button>
      <button class="modal-tab" data-tab="uid">按 UID 导入</button>
    </div>

    <div class="modal-body">
      <div data-panel="folder">
        <input id="folderInput" type="text" spellcheck="false" autocomplete="off"
               placeholder="https://space.bilibili.com/xxx/favlist?fid=123456 或 123456" />
        <p class="modal-tip">支持粘贴收藏夹页面网址，会自动识别 <code>fid</code></p>
      </div>
      <div data-panel="uid" hidden>
        <input id="uidInput" type="text" spellcheck="false" autocomplete="off" placeholder="你的 B 站 UID，例如 12345678" />
        <p class="modal-tip">会把这个账号下所有<b>公开</b>收藏夹一次性导入</p>
      </div>
      <div id="modalErr" class="modal-err" hidden></div>
    </div>

    <div class="modal-actions">
      <button id="modalCancel" class="ghost-btn">取消</button>
      <button id="modalOk" class="primary-btn">确定</button>
    </div>
  </div>
</div>

<!-- ============ 单曲大图视图 ============ -->
<div id="npView" class="np-view" hidden>
  <div id="npBg" class="np-bg"></div>
  <canvas id="npViz" class="np-viz"></canvas>

  <div class="np-inner">
    <button id="npClose" class="np-close" title="收起 (Esc)" aria-label="收起">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>

    <div id="npArt" class="np-art"></div>

    <div class="np-info">
      <h2 id="npBigTitle">未在播放</h2>
      <p id="npBigUpper">—</p>
    </div>

    <div class="np-progress-row">
      <span id="npCur" class="t-time">0:00</span>
      <div id="npProgress" class="progress" role="slider" tabindex="0" aria-label="播放进度">
        <div class="progress-track"><div id="npFill" class="progress-fill"></div></div>
        <div id="npKnob" class="progress-knob"></div>
      </div>
      <span id="npTot" class="t-time">0:00</span>
    </div>

    <div class="np-controls">
      <button id="npMode" class="icon-btn np-mode" title="播放模式">
        <svg id="npModeList" viewBox="0 0 24 24" width="19" height="19"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 15.5 l2.5 2.5 2.5-2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2,-1)"/></svg>
        <svg id="npModeOne" class="hide" viewBox="0 0 24 24" width="19" height="19"><path d="M4 7h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="15.5" y="17.5" font-size="11" font-weight="700" fill="currentColor">1</text><path d="M17.5 14.5 l2.5 2.5 2.5-2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2,-1)"/></svg>
        <svg id="npModeShuffle" class="hide" viewBox="0 0 24 24" width="19" height="19"><path d="M4 7h4l8 10h4M4 17h4l3-3.7M14 8.2 L16 7h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 4.5 L21 7 l-2.5 2.5M18.5 14.5 L21 17 l-2.5 2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="np-transport">
        <button id="npPrev" class="icon-btn" title="上一首">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M18 5 L8 12 L18 19 Z" fill="currentColor"/><rect x="5" y="5" width="2.2" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button id="npPlay" class="play-btn np-play" title="播放 / 暂停">
          <svg id="npIconPlay" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5 L19 12 L8 19 Z" fill="currentColor"/></svg>
          <svg id="npIconPause" class="hide" viewBox="0 0 24 24" width="26" height="26"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>
        <button id="npNext" class="icon-btn" title="下一首">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 5 L16 12 L6 19 Z" fill="currentColor"/><rect x="16.8" y="5" width="2.2" height="14" rx="1" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="np-volume">
        <svg class="np-vol-icon" viewBox="0 0 24 24" width="16" height="16">
          <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/>
          <path id="npVolWave" d="M15.5 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/>
        </svg>
        <div id="npVolBar" class="vol-bar np-vol-bar" role="slider" tabindex="0"
             aria-label="音量" aria-valuemin="0" aria-valuemax="100">
          <div class="vol-track"><div id="npVolFill" class="vol-fill"></div></div>
          <div id="npVolKnob" class="vol-knob"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
